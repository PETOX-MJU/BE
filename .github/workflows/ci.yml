name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/fakedb
      SUPABASE_URL: https://fake-project.supabase.co
      SUPABASE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.fake-signature
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pip install ruff pytest httpx
      - run: ruff check .
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 평범한 postgres로는 안 된다. 테스트가 auth.users와 auth.uid(), authenticated
      # 롤을 쓰고 마이그레이션이 pg_cron을 건다. start가 마이그레이션까지 적용한다.
      - run: supabase start
      - run: pytest
