name: Secret Detection

on:
  pull_request:
    branches: [dev]
    paths:
      - '**.py'
      - '**.sql'
      - '**.yml'
      - '**.yaml'
      - '**.toml'
      - '**.env*'
      - '**.cfg'
      - '**.ini'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        run: |
          curl -L https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --report-format json --report-path gitleaks-report.json || true

      - name: Post findings as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'gitleaks-report.json';
            let body = '## 🔐 Secret Detection\n\n';

            if (fs.existsSync(reportPath)) {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const findings = report.data?.findings || [];

              if (findings.length === 0) {
                body += '✅ 시크릿/키 탐지 결과: **없음**\n\n';
              } else {
                body += `⚠️ **탐지됨: ${findings.length}건**\n\n`;
                findings.forEach((f, i) => {
                  const location = f.File + ':' + (f.Line || '?');
                  const snippet = (f.Snippet || '').substring(0, 100);
                  const isKnown = f.Description?.includes('known') || f.Description?.includes('false positive');
                  const status = isKnown ? '🤔(검증 필요)' : '🔴';
                  body += `### ${status} 발견 ${i+1}\n`;
                  body += `- **위치:** \`${location}\`\n`;
                  body += `- **유형:** ${f.Description || f.RuleID || 'unknown'}\n`;
                  body += `- **스니펫:** \`${snippet}\`\n\n`;
                });
                body += '---\n> 💡 Gitleaks 규칙 기반 탐지 결과입니다. 오탐일 수 있으니 확인 후 조치하세요.\n';
              }
            } else {
              body += '⚠️ Gitleaks 리포트 생성 실패\n\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
